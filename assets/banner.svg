<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1e3a"/>
      <stop offset="55%" stop-color="#10294f"/>
      <stop offset="100%" stop-color="#1a3a6b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <circle cx="320" cy="240" r="200" fill="url(#glow)"/>

  <!-- network lines -->
  <g stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.5">
    <line x1="120" y1="90" x2="320" y2="240"/>
    <line x1="520" y1="70" x2="320" y2="240"/>
    <line x1="560" y1="380" x2="320" y2="240"/>
    <line x1="100" y1="390" x2="320" y2="240"/>
    <line x1="320" y1="40" x2="320" y2="240"/>
    <line x1="120" y1="90" x2="320" y2="40"/>
    <line x1="520" y1="70" x2="560" y2="380"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="120" cy="90" r="6" fill-opacity="0.8"/>
    <circle cx="520" cy="70" r="6" fill-opacity="0.8"/>
    <circle cx="560" cy="380" r="6" fill-opacity="0.8"/>
    <circle cx="100" cy="390" r="6" fill-opacity="0.8"/>
    <circle cx="320" cy="40" r="6" fill-opacity="0.8"/>
  </g>

  <!-- central robot head -->
  <g transform="translate(320,240)">
    <rect x="-70" y="-60" width="140" height="120" rx="28" fill="#0d2444" stroke="#38bdf8" stroke-width="3"/>
    <line x1="0" y1="-60" x2="0" y2="-88" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="0" cy="-96" r="9" fill="#fb923c"/>
    <circle cx="-32" cy="-16" r="13" fill="#38bdf8"/>
    <circle cx="32" cy="-16" r="13" fill="#38bdf8"/>
    <circle cx="-32" cy="-16" r="5" fill="#0b1e3a"/>
    <circle cx="32" cy="-16" r="5" fill="#0b1e3a"/>
    <rect x="-30" y="18" width="60" height="10" rx="5" fill="#fb923c"/>
    <rect x="-86" y="-24" width="16" height="40" rx="8" fill="#38bdf8"/>
    <rect x="70" y="-24" width="16" height="40" rx="8" fill="#38bdf8"/>
  </g>

  <!-- orbiting tool icons -->
  <g font-size="34" text-anchor="middle">
    <text x="120" y="102">📖</text>
    <text x="520" y="82">🛠️</text>
    <text x="560" y="394">💬</text>
    <text x="100" y="404">🚀</text>
    <text x="320" y="52">🧠</text>
  </g>

  <!-- title -->
  <text x="700" y="180" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="72" font-weight="800" fill="#ffffff">AI Agent 实战手册</text>
  <text x="700" y="238" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" fill="url(#accent)" font-weight="700">Chinese AI Agent Handbook · 中英双语</text>
  <text x="700" y="300" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" fill="#cbd5e1">从零基础到生产部署 · 10+ 框架 · 25+ 章 · 可运行示例</text>

  <g transform="translate(700,340)">
    <rect x="0" y="0" width="150" height="44" rx="22" fill="#38bdf8"/>
    <text x="75" y="30" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#0b1e3a" text-anchor="middle">10分钟入门</text>
    <rect x="166" y="0" width="150" height="44" rx="22" fill="none" stroke="#fb923c" stroke-width="2.5"/>
    <text x="241" y="30" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#fb923c" text-anchor="middle">国产模型可跑</text>
    <rect x="332" y="0" width="150" height="44" rx="22" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="407" y="30" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#38bdf8" text-anchor="middle">周更雷达</text>
  </g>
</svg>
