name: Stars Snapshot

on:
  schedule:
    - cron: "0 6 * * 5"  # 每周五 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run stars refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/refresh_stars.py

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status --porcelain
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected, skipping commit."
          fi

      - name: Commit and push
        if: steps.diff.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stars.json data/stars-history.csv README.md
          git commit -m "chore: weekly stars snapshot"
          # 定时快照可能与人工/其他推送撞车，先 rebase 再重试
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "✅ push succeeded"
              exit 0
            fi
            echo "⚠️ push failed (attempt $i), retrying in 5s..."
            sleep 5
          done
          echo "❌ push failed after 3 attempts"
          exit 1
