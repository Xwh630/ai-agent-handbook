name: CLI Package Check

# 守护「pip install 之后 CLI 能用」这条底线。
#
# 背景：chapters/ 与 data/ 是仓库根的单一数据源，靠 in-tree 构建后端
# build_backend.py 在构建时同步进包内。早期依赖手动预同步，导致
# `pip install git+...` 装出来的是没有章节数据的空壳 CLI。本 workflow
# 在干净检出（天然不含被 gitignore 的包内副本）上构建并实装实跑，
# 任何让产物退回空壳的改动都会在这里红掉。

on:
  schedule:
    - cron: "0 5 * * 1"  # 每周一 05:00 UTC
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm package data is NOT committed
        # 干净检出里不应该有 src/agent_handbook/chapters/，否则说明
        # 有人把构建产物提交进了 git（会造成数据漂移）
        run: |
          if [ -d "src/agent_handbook/chapters" ]; then
            echo "::error::src/agent_handbook/chapters/ 被提交进了 git——它是构建产物，应留在 .gitignore"
            exit 1
          fi
          echo "OK：包内数据目录未被提交，构建时必须由后端同步"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify artifacts contain chapter data
        run: |
          python scripts/build_cli.py --verify-only

  install-and-run:
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install into a clean venv and run the CLI
        run: |
          python -m venv /tmp/handbook-venv
          /tmp/handbook-venv/bin/python -m pip install --quiet dist/*.whl
          cd /tmp   # 离开仓库目录，确保用的是包内数据而不是仓库数据

          echo "--- handbook list ---"
          /tmp/handbook-venv/bin/handbook list | tail -n 3

          echo "--- handbook search ---"
          /tmp/handbook-venv/bin/handbook search 上下文压缩 | head -n 4

          echo "--- handbook doctor (empty dir) ---"
          mkdir -p /tmp/handbook-empty && cd /tmp/handbook-empty
          /tmp/handbook-venv/bin/handbook doctor . | tail -n 4

          echo "--- assertions ---"
          COUNT=$(/tmp/handbook-venv/bin/python -c "import agent_handbook,pathlib;p=pathlib.Path(agent_handbook.__file__).parent;print(len(list((p/'chapters').glob('*.md'))))")
          echo "bundled chapters: $COUNT"
          if [ "$COUNT" -lt 29 ]; then
            echo "::error::安装后的包只有 $COUNT 个章节，CLI 数据不完整"
            exit 1
          fi
          if ! /tmp/handbook-venv/bin/handbook list | grep -q "99-glossary"; then
            echo "::error::handbook list 输出缺少术语表章节"
            exit 1
          fi
          echo "OK：安装后的 CLI 数据完整、命令可跑"
