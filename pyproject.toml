[build-system]
requires = ["setuptools>=61.0"]
# in-tree 后端：构建时自动把 chapters/ 与 data/ 同步进包内，
# 否则从 git 安装会得到没有章节数据的空壳 CLI。详见 build_backend.py
build-backend = "build_backend"
backend-path = ["."]

[project]
# ⚠️ 名字里不能出现 "agent-handbook" 之外的变体都不行：
# PyPI 对「连字符 / 下划线 / 点」做归一化，agent-handbook、agent_handbook、
# agent.handbook 视为同一个项目名。若与其它包撞名，Trusted Publishing 会直接 403。
name = "agent-handbook"
# 与 GitHub Release 标签保持一致：tag vX.Y.Z → 版本 X.Y.Z
version = "1.6.0"
description = "AI Agent 实战手册命令行工具：一行命令给任何 Agent 项目做 Harness 五支柱体检 + 31 章全文检索 + 项目脚手架"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Xwh630", email = "hi@xwh630.dev" }]
keywords = ["ai", "agent", "llm", "harness", "doctor", "cli", "chinese", "handbook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/Xwh630/ai-agent-handbook"
Documentation = "https://xwh630.github.io/ai-agent-handbook/"
Repository = "https://github.com/Xwh630/ai-agent-handbook"
Issues = "https://github.com/Xwh630/ai-agent-handbook/issues"
Changelog = "https://github.com/Xwh630/ai-agent-handbook/releases"

[project.scripts]
handbook = "agent_handbook.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_handbook = ["chapters/*.md", "data/*.json", "data/*.csv"]
