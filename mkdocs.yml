site_name: AI Agent 实战手册
site_description: 中文 AI Agent 实战手册 - 从零基础到全栈开发的系统化教程（双语）
site_url: https://xwh630.github.io/ai-agent-handbook/
repo_url: https://github.com/Xwh630/ai-agent-handbook
docs_dir: site-content
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

extra:
  generator: false

copyright: MIT License · AI Agent 实战手册

nav:
  - 首页: README.md
  - 🚀 新手专区:
