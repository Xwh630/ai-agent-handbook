      - 第 2 章 · 从零手写 ReAct Agent: chapters/02-reaact-from-scratch.md
      - 第 7 章 · Dify 低代码平台: chapters/07-dify.md
      - 第 12 章 · Ollama 本地部署: chapters/12-ollama.md
  - 进阶篇:
      - 第 3 章 · LangGraph 图编排: chapters/03-langgraph.md
      - 第 4 章 · CrewAI 多智能体: chapters/04-crewai.md
      - 第 5 章 · AutoGen / MAF: chapters/05-autogen.md
      - 第 6 章 · LlamaIndex RAG: chapters/06-llamaindex-rag.md
      - 第 8 章 · OpenAI Agents SDK: chapters/08-openai-agents.md
